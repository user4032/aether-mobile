<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Aether — encrypted messaging">

  <!-- ── PWA / iOS ───────────────────────────────────────────────────────── -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Aether">
  <meta name="mobile-web-app-capable" content="yes">

  <!-- Зробити сторінку повноекранною і без зуму -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- ── Theme ────────────────────────────────────────────────────────────── -->
  <meta name="theme-color" content="#000000">
  <meta name="msapplication-TileColor" content="#000000">

  <!-- ── Icons ────────────────────────────────────────────────────────────── -->
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="152x152" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="167x167" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- ── iOS Splash screens ────────────────────────────────────────────────
       Для кожного розміру екрана iOS потрібен свій splash.
       Якщо нема цих файлів — просто видали ці рядки.
       Можеш згенерувати їх на: progressier.com або pwa-asset-generator
  ────────────────────────────────────────────────────────────────────────── -->
  <!-- iPhone 14 Pro Max -->
  <link rel="apple-touch-startup-image" media="screen and (device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)" href="splash/splash-1290x2796.png">
  <!-- iPhone 14 / 13 / 12 -->
  <link rel="apple-touch-startup-image" media="screen and (device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)" href="splash/splash-1170x2532.png">
  <!-- iPhone SE 3rd gen -->
  <link rel="apple-touch-startup-image" media="screen and (device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2)" href="splash/splash-750x1334.png">
  <!-- iPad Pro 12.9" -->
  <link rel="apple-touch-startup-image" media="screen and (device-width: 1024px) and (device-height: 1366px) and (-webkit-device-pixel-ratio: 2)" href="splash/splash-2048x2732.png">

  <title>Aether</title>
  <link rel="manifest" href="manifest.json">

  <!-- ── Стилі для iOS glass PWA ──────────────────────────────────────────── -->
  <style>
    /* Повне чорне тло при запуску */
    html, body {
      margin: 0;
      padding: 0;
      background-color: #000000;
      /* Важливо для iOS safe area */
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    /* Прибираємо будь-який scroll bounce на iOS */
    body {
      overflow: hidden;
      position: fixed;
      width: 100%;
      height: 100%;
    }

    /* Flutter canvas */
    flt-glass-pane, .flt-glass-pane {
      background: transparent !important;
    }

    /* iOS glass / blur support — Flutter використовує WebGL canvas
       але цей клас гарантує що root є прозорим */
    #flutter-app {
      background: transparent;
    }

    /* Сплеш при завантаженні */
    #loading-screen {
      position: fixed;
      inset: 0;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s ease;
    }

    #loading-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loading-logo {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
      font-size: 32px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -1px;
      margin-bottom: 8px;
    }

    .loading-sub {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 13px;
      color: rgba(255,255,255,0.4);
      letter-spacing: 0.5px;
    }

    .loading-dots {
      display: flex;
      gap: 6px;
      margin-top: 32px;
    }

    .loading-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255,255,255,0.3);
      animation: pulse 1.2s ease-in-out infinite;
    }

    .loading-dot:nth-child(2) { animation-delay: 0.2s; }
    .loading-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes pulse {
      0%, 80%, 100% { transform: scale(0.8); opacity: 0.4; }
      40% { transform: scale(1.2); opacity: 1; }
    }

    /* iOS momentum scroll для Flutter scroll views */
    * {
      -webkit-overflow-scrolling: touch;
    }

    /* Прибираємо виділення тексту на iOS при тапі */
    * {
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
  </style>
</head>
<body>

  <!-- Сплеш екран (зникне після завантаження Flutter) -->
  <div id="loading-screen">
    <div class="loading-logo">Aether</div>
    <div class="loading-sub">Core Protocol</div>
    <div class="loading-dots">
      <div class="loading-dot"></div>
      <div class="loading-dot"></div>
      <div class="loading-dot"></div>
    </div>
  </div>

  <script>
    // Приховати сплеш після завантаження Flutter
    window.addEventListener('flutter-first-frame', function() {
      const splash = document.getElementById('loading-screen');
      if (splash) {
        splash.classList.add('hidden');
        setTimeout(() => splash.remove(), 600);
      }
    });

    // iOS PWA: Запобігаємо подвійному тапу для zoom
    let lastTouchEnd = 0;
    document.addEventListener('touchend', function(event) {
      const now = Date.now();
      if (now - lastTouchEnd <= 300) event.preventDefault();
      lastTouchEnd = now;
    }, false);

    // iOS PWA: Запобігаємо pinch-zoom
    document.addEventListener('touchmove', function(e) {
      if (e.touches.length > 1) e.preventDefault();
    }, { passive: false });

    // iOS standalone mode detection
    if (window.navigator.standalone) {
      document.documentElement.classList.add('pwa-standalone');
    }
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
