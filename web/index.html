<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Aether Core Protocol - Secure Messaging.">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Aether">
  
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png" sizes="192x192">
  <link rel="icon" type="image/png" href="icons/icon-512.png" sizes="512x512">
  <link rel="manifest" href="manifest.json">

  <title>Aether</title>

  <style>
    /* Стиль Koenigsegg: глибокий чорний, преміальний шрифт, мінімалізм */
    body {
      background-color: #000000;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #ffffff;
      overflow: hidden;
    }
    .aether-logo {
      width: 120px;
      height: 120px;
      border-radius: 30px;
      margin-bottom: 40px;
      box-shadow: 0 10px 30px rgba(176, 38, 255, 0.2);
      animation: pulse 2s infinite ease-in-out;
    }
    .brand-text {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .sub-text {
      font-size: 11px;
      color: #888888;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .loader-line {
      width: 150px;
      height: 2px;
      background-color: #222;
      margin-top: 40px;
      position: relative;
      overflow: hidden;
    }
    .loader-line::after {
      content: '';
      position: absolute;
      left: -50%;
      height: 100%;
      width: 50%;
      background-color: #ffffff;
      animation: load 1.5s infinite ease-in-out;
    }
    @keyframes pulse {
      0% { transform: scale(0.98); box-shadow: 0 0 20px rgba(255,255,255,0.05); }
      50% { transform: scale(1.02); box-shadow: 0 0 40px rgba(255,255,255,0.15); }
      100% { transform: scale(0.98); box-shadow: 0 0 20px rgba(255,255,255,0.05); }
    }
    @keyframes load {
      0% { left: -50%; }
      100% { left: 100%; }
    }
  </style>
</head>
<body>
  <img src="icons/icon-192.png" alt="Aether Logo" class="aether-logo">
  <div class="brand-text">Aether</div>
  <div class="sub-text">Core Protocol</div>
  <div class="loader-line"></div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
