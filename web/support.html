<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="author" content="LUMYN Protocol">
  <meta name="description" content="Зв'яжіться з підтримкою LUMYN">
  
  <link rel="icon" href="icons/favicon.png?v=7"> 
  <link rel="apple-touch-icon" href="icons/logo-192.png?v=7">
  <link rel="apple-touch-icon" href="icons/logo-192.png?v=6">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/logo-192.png?v=6">
  <link rel="mask-icon" href="icons/white-apple-logo-transparent.png" color="#000000">
  <link rel="manifest" href="manifest.json">
  
  <title>LUMYN | Підтримка </title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
  
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { overflow-y: scroll; color-scheme: dark; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.2) #000000; }
    ::-webkit-scrollbar { width: 8px; } ::-webkit-scrollbar-track { background: #000000; } ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
    
    body { background: #000000; color: #f5f5f7; font-family: 'Inter', sans-serif; overflow-x: hidden; display: flex; flex-direction: column; min-height: 100vh; }
    
    /* NAV */
    nav { position: fixed; top: 0; left: 0; right: 0; z-index: 200; padding: 0 40px; height: 80px; display: flex; align-items: center; justify-content: space-between; background: rgba(0,0,0,0.8); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.08); }
    .nav-logo { font-size: 16px; font-weight: 900; letter-spacing: 4px; text-transform: uppercase; display: flex; align-items: center; gap: 12px; text-decoration: none; color: #fff; }
    .nav-logo img { width: 28px; height: 28px; border-radius: 6px; }
    .nav-links { display: flex; gap: 24px; align-items: center; }
    .nav-links a { color: #86868b; text-decoration: none; font-size: 12px; font-weight: 500; letter-spacing: 1px; text-transform: uppercase; transition: color 0.2s; }
    .nav-links a:hover, .nav-links a.active { color: #f5f5f7; }
    @media (max-width: 768px) { .nav-links { display: none; } nav { padding: 0 20px; } }

    /* HEADER */
    main { flex: 1; display: flex; flex-direction: column; align-items: center; padding-top: 150px; padding-bottom: 80px; }
    .page-header { text-align: center; margin-bottom: 40px; }
    .page-header h1 { font-size: clamp(36px, 6vw, 56px); font-weight: 900; letter-spacing: -1.5px; margin-bottom: 12px; color: #fff; }
    .page-header p { color: #86868b; font-size: 16px; font-weight: 400; }

    /* ─── 1:1 APPLE SUPPORT FORM ─── */
    .support-form-container { width: 100%; max-width: 480px; background: #0a0a0a; border: 1px solid rgba(255,255,255,0.06); border-radius: 16px; padding: 32px; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600; color: #6e6e73; margin-bottom: 8px; letter-spacing: 1.5px; text-transform: uppercase; }
    .form-control { width: 100%; background: #000000; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 14px 16px; color: #f5f5f7; font-family: 'Inter', sans-serif; font-size: 15px; outline: none; transition: border-color 0.2s; }
    .form-control::placeholder { color: #555; }
    .form-control:focus { border-color: #86868b; }
    textarea.form-control { resize: vertical; min-height: 120px; line-height: 1.5; }
    
    .btn-submit { width: 100%; background: #ffffff; color: #000000; border: none; padding: 14px; border-radius: 8px; font-family: 'Inter', sans-serif; font-weight: 700; font-size: 15px; cursor: pointer; transition: opacity 0.2s; margin-top: 10px; }
    .btn-submit:hover { opacity: 0.85; }

    /* ─── APPLE FOOTER ─── */
    .apple-footer { background: #111111; color: #86868b; font-family: 'Inter', sans-serif; font-size: 12px; line-height: 1.33337; font-weight: 400; padding: 0 22px; border-top: 1px solid rgba(255,255,255,0.1); width: 100%; position: relative; z-index: 10;}
    .apple-footer-content { max-width: 980px; margin: 0 auto; padding: 20px 0; }
    .footer-breadcrumbs { display: flex; align-items: center; gap: 8px; padding-bottom: 16px; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 20px; }
    .footer-breadcrumbs a { color: #f5f5f7; text-decoration: none; font-weight: 500; font-size: 12px; display: flex; align-items: center; gap: 6px; }
    .footer-breadcrumbs a:hover { text-decoration: underline; }
    /* РОБИМО ЛОГОТИП БІЛИМ ТА МАЛЕНЬКИМ ДЛЯ ЧОРНОГО ФОНУ */
    /* РОБИМО ЛОГОТИП МАЛЕНЬКИМ ТА БІЛИМ (ДЛЯ ЧОРНОГО ФОНУ) */
    .footer-breadcrumbs img {
      width: 18px !important; /* Жорсткий розмір (як ) */
      height: 18px !important;
      border-radius: 4px;
      object-fit: contain;
      filter: invert(1); /* ЦЕЙ РЯДОК РОБИТЬ ЧОРНИЙ ЛОГОТИП БІЛИМ! */
      opacity: 0.9; /* Легка прозорість для преміального вигляду */
    }
    .footer-directory { display: flex; flex-wrap: wrap; margin-bottom: 20px; }
    .footer-directory-column { flex: 1; flex-basis: 20%; min-width: 150px; margin-bottom: 20px; }
    .footer-directory-column-title { color: #f5f5f7; font-size: 12px; font-weight: 600; margin-bottom: 10px; }
    .footer-directory-list { list-style: none; padding: 0; margin: 0; }
    .footer-directory-list li { margin-bottom: 8px; }
    .footer-directory-list a { color: #86868b; text-decoration: none; transition: color 0.2s; }
    .footer-directory-list a:hover { color: #f5f5f7; text-decoration: underline; }
    .footer-mini { padding-top: 16px; border-top: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; gap: 12px; }
    .footer-mini-legal { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
    @media (max-width: 833px) { .footer-directory { display: none; } .footer-mini-legal { flex-direction: column; align-items: flex-start; } }
  </style>
</head>
<body>
  <nav>
    <a href="/main" class="nav-logo">
      <img src="icons/logo-192.png" alt="Logo"> LUMYN
    </a>
    <div class="nav-links">
      <a href="/main">Головна</a>
      <a href="/download">Додатки</a>
      <a href="/faq">ЧаПи</a>
      <a href="/support">Підтримка</a>
    </div>
  </nav>

  <main>
    <header class="page-header">
      <h1>ЗВ'ЯЗОК.</h1>
      <p>Знайшли баг чи маєте пропозиції? Напишіть нам.</p>
    </header>

    <div class="support-form-container">
      <form action="ТВІЙ_FORMSPREE_URL_ТУТ" method="POST">
        
        <div class="form-group">
          <label for="name">Ваше ім'я</label>
          <input type="text" id="name" name="name" class="form-control" placeholder="John Doe" required>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="_replyto" class="form-control" placeholder="john@example.com" required>
        </div>

        <div class="form-group">
          <label for="message">Повідомлення</label>
          <textarea id="message" name="message" class="form-control" placeholder="Опишіть вашу проблему..." required></textarea>
        </div>
        
        <input type="hidden" name="_next" value="support.html">
        <input type="hidden" name="_gotcha" style="display:none">

        <button type="submit" class="btn-submit">Надіслати запит</button>
      </form>
    </div>
  </main>

  <footer class="apple-footer">
    <div class="apple-footer-content">
      
      <div class="footer-breadcrumbs">
        <a href="/main">
          <img src="icons/logo-192.png" alt="LUMYN"> LUMYN
        </a>
        <span>›</span>
        <span>Підтримка</span> </div>

      <div class="footer-directory">
        <div class="footer-directory-column">
          <h3 class="footer-directory-column-title">LUMYN</h3>
          <ul class="footer-directory-list">
            <li><a href="/main">Головна</a></li>
            <li><a href="/download">Додатки</a></li>
          </ul>
        </div>
        <div class="footer-directory-column">
          <h3 class="footer-directory-column-title">Ресурси</h3>
          <ul class="footer-directory-list">
            <li><a href="/faq">ЧаПи</a></li>
            <li><a href="/support">Підтримка</a></li>
          </ul>
        </div>
      </div>

      <div class="footer-mini">
        <div class="footer-mini-legal">
          <div>Copyright © 2026 LUMYN Protocol. All rights reserved.</div>
          <div class="footer-mini-legal-links">
            <span style="color: #86868b;">Made in Ukraine 🇺🇦</span>
          </div>
        </div>
      </div>
    </div>
  </footer>
</body>
</html>
